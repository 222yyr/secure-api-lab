version: '2'
services:
  flink:
    image: vulhub/flink:1.11.2
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink"
    expose:
      - "8081"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flink

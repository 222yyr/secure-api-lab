name: Security CI Scan
on:
  push:
  pull_request:

jobs:
  security_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装项目依赖与安全扫描工具
        run: |
          pip install -r requirements.txt
          pip install bandit safety

      - name: SAST Bandit静态代码扫描
        run: bandit -r . || true

    
      # ========= SCA OWASP Dependency‑Check (Lab manual required tool) =========
      - name: SCA-OWASP Dependency-Check scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Work1-Secure-REST-API"
          scan: "."
          format: "HTML"
          out: reports
          failOnCVSS: 10
          autoUpdate: true
          args: >
            --enableExperimental
            --exclude "**/.github/**"

      # 上传HTML报告作为流水线产物 artifact
      - name: Upload Dependency-Check HTML report artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: OWASP-Dependency-Check-Report
          path: reports
          retention-days: 30






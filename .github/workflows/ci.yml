name: Security CI Scan
on:
  push:
  pull_request:
jobs:
  security_scan_job:
    runs-on:  ubuntu-24.04

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5
      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装项目依赖与安全扫描工具
        run: |
          pip install -r requirements.txt
          pip install bandit safety
      - name: SAST Bandit静态代码扫描
        run: bandit -r . || true
      
      
  snyk_scan_job:
    runs-on:  ubuntu-24.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 配置Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装Snyk CLI 和 html转换工具
        run: |
          npm install -g snyk
          npm install -g snyk-to-html

      - name: Snyk扫描并导出json结果
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --json > snyk-report.json || true
         
      - name: 输出Snyk漏洞摘要
        run: |
          echo "### Snyk 扫描结果"
          jq '.vulnerabilities[] | {CVE: .id, severity: .severity, package: .packageName, title: .title}' snyk-report.json

      - name: 转为HTML报告
        run: |
          snyk-to-html -i snyk-report.json -o snyk-report.html

      - name: 上传Snyk报告
        uses: actions/upload-artifact@v6
        with:
          name: snyk-scan-report
          path: snyk-report.html

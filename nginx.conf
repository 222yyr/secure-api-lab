server {
    listen 80;
    location / {
        proxy_pass http://flink:8081;
        proxy_set_header Host $host;
    }
    # 拦截 jobmanager/logs 下包含目录穿越特征的请求
    location ~ ^/jobmanager/logs {
        if ($request_uri ~ "\.\.|%252f") {
            return 403;
        }
        proxy_pass http://flink:8081;
        proxy_set_header Host $host;
    }
}


